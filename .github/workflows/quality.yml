name: Quality checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint PHP
        run: find lib pages bin tests -name '*.php' -print0 | xargs -0 -n1 php -l && php -l health.php
      - name: Check JavaScript syntax
        run: find assets tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run JavaScript tests
        run: node --test tests/*.test.js
